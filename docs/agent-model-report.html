<title>Tang Agent Model</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Mono:wght@400;600&display=swap">
<style>
/* Layout: a desktop modelling tool — title bar, ribbon, project browser | diagram canvas / generated report | properties, status bar */
:root{
  --desk:#C9D2DE; --chrome:#E8EDF3; --chrome-2:#DCE3EC; --panel:#F6F8FB; --border:#B4BFCD; --border-soft:#D3DAE4;
  --ink:#1B2430; --ink-2:#4B5668; --ink-3:#7A8597; --accent:#2B66AE; --accent-soft:#D6E4F5; --on-accent:#FFFFFF;
  --canvas:#FFFFFF; --grid:#E4E9F0; --paper:#FFFFFF;
  --el:#FFFBDA; --el-line:#9A3B25; --el2:#E7F0FA; --el2-line:#3D6C9E; --el3:#EAF5E6; --el3-line:#4C7A3C;
  --line:#3A4049; --note:#FFF5B0; --note-line:#A38A2C; --lane:#EEF2F8; --frame:#5E6876; --sel:#1E73D8;
  --ui:"Noto Sans","Segoe UI",Tahoma,system-ui,sans-serif; --mono:"Noto Sans Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#121418; --chrome:#22262D; --chrome-2:#2A2F37; --panel:#1B1F25; --border:#3B424D; --border-soft:#2F353E;
  --ink:#E4E8EE; --ink-2:#A9B2BF; --ink-3:#7D8796; --accent:#5E9DE8; --accent-soft:#233A57; --on-accent:#0D1420;
  --canvas:#181B20; --grid:#22272E; --paper:#1D2127;
  --el:#2E2A1C; --el-line:#E0906F; --el2:#1C2A3A; --el2-line:#7FAEE0; --el3:#1E2B1D; --el3-line:#8DC27A;
  --line:#B9C1CC; --note:#3A3420; --note-line:#B49C52; --lane:#20252C; --frame:#8C96A4; --sel:#5EA8FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#121418; --chrome:#22262D; --chrome-2:#2A2F37; --panel:#1B1F25; --border:#3B424D; --border-soft:#2F353E;
  --ink:#E4E8EE; --ink-2:#A9B2BF; --ink-3:#7D8796; --accent:#5E9DE8; --accent-soft:#233A57; --on-accent:#0D1420;
  --canvas:#181B20; --grid:#22272E; --paper:#1D2127;
  --el:#2E2A1C; --el-line:#E0906F; --el2:#1C2A3A; --el2-line:#7FAEE0; --el3:#1E2B1D; --el3-line:#8DC27A;
  --line:#B9C1CC; --note:#3A3420; --note-line:#B49C52; --lane:#20252C; --frame:#8C96A4; --sel:#5EA8FF; color-scheme:dark}

html,body{height:100%}
body{background:var(--desk);color:var(--ink);font:13px/1.45 var(--ui);padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:1px}

.win{height:100%;display:grid;grid-template-rows:auto auto 1fr auto;background:var(--chrome);border:1px solid var(--border);
  border-radius:6px;overflow:hidden;box-shadow:0 8px 30px rgb(0 0 0 / .18);min-height:0}
.titlebar{display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--chrome-2);border-bottom:1px solid var(--border);font-size:12px;color:var(--ink-2)}
.titlebar .logo{width:16px;height:16px;flex:none}
.titlebar .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.titlebar .t b{color:var(--ink);font-weight:600}
.dots{display:flex;gap:6px}.dots i{width:11px;height:11px;border-radius:50%;background:var(--border);display:block}

.ribbon{background:var(--chrome);border-bottom:1px solid var(--border)}
.rtabs{display:flex;gap:2px;padding:4px 8px 0;font-size:12px;overflow-x:auto}
.rtabs span{padding:4px 12px;color:var(--ink-2);border:1px solid transparent;border-bottom:none;border-radius:4px 4px 0 0;white-space:nowrap}
.rtabs span.on{background:var(--panel);color:var(--ink);border-color:var(--border);font-weight:600;margin-bottom:-1px}
.rbody{display:flex;gap:0;background:var(--panel);border-top:1px solid var(--border);padding:6px 4px 2px;overflow-x:auto}
.rgroup{display:flex;flex-direction:column;align-items:center;padding:0 10px;border-right:1px solid var(--border-soft)}
.rgroup .btns{display:flex;gap:2px}
.rgroup .cap{font-size:10.5px;color:var(--ink-3);padding-top:2px;white-space:nowrap}
.rb{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:1px solid transparent;border-radius:3px;padding:3px 7px;cursor:pointer;font-size:11px;min-width:46px;white-space:nowrap}
.rb:hover{background:var(--accent-soft);border-color:var(--border)}
.rb[disabled]{opacity:.4;cursor:default;background:none;border-color:transparent}
.rb svg{width:20px;height:20px}

.main{display:grid;grid-template-columns:250px minmax(0,1fr) 280px;min-height:0}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel)}
.pane+.pane{border-left:1px solid var(--border)}
.phead{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;font-size:11.5px;font-weight:600;color:var(--ink-2);
  background:var(--chrome-2);border-bottom:1px solid var(--border);letter-spacing:.02em}
.pscroll{overflow:auto;min-height:0;flex:1}

/* project browser */
.tree{list-style:none;margin:0;padding:4px 0;font-size:12.5px}
.tree ul{list-style:none;margin:0;padding-left:14px}
.tree .row{display:flex;align-items:center;gap:5px;padding:2px 8px;cursor:pointer;white-space:nowrap;border:1px solid transparent;width:100%;background:none;text-align:left}
.tree .row:hover{background:var(--accent-soft)}
.tree .row.on{background:var(--accent);color:var(--on-accent)}
.tree .row svg{flex:none;width:16px;height:16px}
.tree .tw{width:10px;flex:none;color:var(--ink-3);font-size:9px}
.tree .row.on .tw{color:inherit}
.tree .lbl{overflow:hidden;text-overflow:ellipsis}
.tree .kind{color:var(--ink-3);font-size:10.5px;margin-left:auto;padding-left:8px}
.tree .row.on .kind{color:inherit;opacity:.8}

/* document tabs */
.center{background:var(--canvas)}
.dtabs{display:flex;gap:0;background:var(--chrome-2);border-bottom:1px solid var(--border);overflow-x:auto;flex:none}
.dtab{display:flex;align-items:center;gap:6px;padding:5px 6px 5px 10px;font-size:12px;border-right:1px solid var(--border);cursor:pointer;white-space:nowrap;color:var(--ink-2);background:none;border-top:2px solid transparent;border-left:none;border-bottom:none}
.dtab.on{background:var(--canvas);color:var(--ink);border-top-color:var(--accent);font-weight:600}
.dtab .x{border:none;background:none;cursor:pointer;color:var(--ink-3);padding:0 4px;border-radius:3px;font-size:13px;line-height:1}
.dtab .x:hover{background:var(--accent-soft);color:var(--ink)}
.view{flex:1;min-height:0;overflow:auto;position:relative}
.canvas{background-color:var(--canvas);background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:12px 12px;padding:16px;min-height:100%}
.canvas svg{display:block}

/* diagram graphics */
.dg text{font-family:var(--ui);fill:var(--ink);font-size:11px}
.dg .b{font-weight:700}.dg .s{font-size:10px;fill:var(--ink-2)}.dg .m{font-family:var(--mono);font-size:10px}
.dg .frame{fill:none;stroke:var(--frame);stroke-width:1}
.dg .ftab{fill:var(--canvas);stroke:var(--frame)}
.dg .shape{fill:var(--el);stroke:var(--el-line);stroke-width:1.2}
.dg .shape2{fill:var(--el2);stroke:var(--el2-line);stroke-width:1.2}
.dg .shape3{fill:var(--el3);stroke:var(--el3-line);stroke-width:1.2}
.dg .ink{fill:var(--line);stroke:var(--line)}
.dg .hollow{fill:var(--canvas);stroke:var(--line);stroke-width:1.2}
.dg .note{fill:var(--note);stroke:var(--note-line)}
.dg .region{fill:none;stroke:var(--frame);stroke-width:1.2}
.dg .lane{fill:none;stroke:var(--frame)}
.dg .lanehd{fill:var(--lane);stroke:var(--frame)}
.dg .pkgtab,.dg .pkg{fill:var(--canvas);stroke:var(--frame);stroke-width:1.1}
.dg .div{stroke:var(--el-line);stroke-width:1}
.dg .cn{fill:none;stroke:var(--line);stroke-width:1.1}
.dg .dash{stroke-dasharray:6 4}
.dg .ll{stroke:var(--frame);stroke-dasharray:5 4}
.dg .elbl{paint-order:stroke;stroke:var(--canvas);stroke-width:4px;stroke-linejoin:round;font-size:10.5px;fill:var(--ink-2)}
.dg .el{cursor:pointer}
.dg .el:hover .shape,.dg .el:hover .shape2,.dg .el:hover .shape3,.dg .el:hover .note,.dg .el:hover .hollow{stroke:var(--sel)}
.dg .handle{fill:var(--sel);stroke:var(--canvas)}
.dg .selbox{fill:none;stroke:var(--sel);stroke-dasharray:3 2}
.mk-line{fill:none;stroke:var(--line);stroke-width:1.2}
.mk-fill{fill:var(--line);stroke:var(--line)}
.mk-hollow{fill:var(--canvas);stroke:var(--line);stroke-width:1.2}

/* generated report */
.report{background:var(--chrome-2);padding:24px 16px 40px;min-height:100%}
.page{max-width:860px;margin:0 auto;background:var(--paper);border:1px solid var(--border);box-shadow:0 2px 10px rgb(0 0 0 / .08);padding:44px 52px}
.page h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
.page h2{font-size:18px;margin:36px 0 8px;padding-bottom:5px;border-bottom:2px solid var(--accent);text-wrap:balance}
.page h3{font-size:14px;margin:22px 0 6px;color:var(--ink);text-wrap:balance}
.page p,.page li{max-width:68ch}
.page p{margin:0 0 10px}
.page code{font-family:var(--mono);font-size:.88em;background:var(--chrome);padding:0 4px;border-radius:3px;white-space:nowrap}
.sub{color:var(--ink-2);margin:0 0 20px;font-size:14px}
.meta{display:grid;grid-template-columns:max-content 1fr;gap:3px 18px;font-size:12.5px;border-top:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);padding:10px 0;margin:0 0 20px}
.meta dt{color:var(--ink-3)}.meta dd{margin:0}
.toc{columns:2;column-gap:28px;padding-left:18px;margin:0 0 6px;font-size:12.5px}
.toc a{color:var(--accent);text-decoration:none}.toc a:hover{text-decoration:underline}
.fig{margin:12px 0 4px;border:1px solid var(--border-soft);overflow-x:auto;background:var(--canvas);cursor:zoom-in;padding:8px}
.fig svg{width:100%;height:auto;min-width:560px;display:block}
.cap{font-size:11.5px;color:var(--ink-3);margin:4px 0 14px}
.cap button{border:none;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:inherit;text-decoration:underline}
.tbl{overflow-x:auto;margin:8px 0 14px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border:1px solid var(--border-soft);padding:5px 8px;text-align:left;vertical-align:top}
th{background:var(--chrome);font-weight:600;color:var(--ink-2);font-size:11.5px}
td:first-child{white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:9px;background:var(--accent-soft);color:var(--ink)}

/* properties */
.props{display:grid;grid-template-columns:max-content minmax(0,1fr);font-size:12px;margin:0}
.props dt,.props dd{padding:3px 8px;border-bottom:1px solid var(--border-soft);margin:0}
.props dt{color:var(--ink-3);background:var(--chrome)}
.props dd{overflow-wrap:anywhere}
.notes{padding:8px 10px;font-size:12.5px;line-height:1.5;color:var(--ink)}
.notes p{margin:0 0 8px}
.notes code{font-family:var(--mono);font-size:.88em}
.ellist{list-style:none;margin:0;padding:2px 0 8px;font-size:12px}
.ellist button{display:block;width:100%;text-align:left;background:none;border:none;padding:2px 10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ellist button:hover{background:var(--accent-soft)}
.ellist button.on{background:var(--accent);color:var(--on-accent)}
.ellist small{color:var(--ink-3)}
.ellist button.on small{color:inherit}

.status{display:flex;gap:16px;align-items:center;padding:3px 10px;background:var(--chrome-2);border-top:1px solid var(--border);font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.status .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}

@media (max-width:1100px){.main{grid-template-columns:220px minmax(0,1fr)}.main>.pane:last-child{display:none}}
@media (max-width:760px){
  body{height:auto}
  .win{height:auto}
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto}
  .main>.pane:first-child .pscroll{max-height:170px}
  .main>.pane+.pane{border-left:none;border-top:1px solid var(--border)}
  .center .view{height:auto;max-height:none;overflow:visible}
  .canvas{overflow-x:auto}
  .page{padding:24px 18px}
  .toc{columns:1}
  .rgroup.hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    <marker id="m-fill" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="mk-fill" d="M1,1 L11,6 L1,11 z"/></marker>
    <marker id="m-tri" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="mk-hollow" d="M1,1 L13,7 L1,13 z"/></marker>
    <marker id="m-dia" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="14" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="mk-fill" d="M1,5 L7,1 L13,5 L7,9 z"/></marker>

<div class="win">
  <div class="titlebar">
    <svg class="logo" viewBox="0 0 16 16"><rect x="1" y="1" width="14" height="14" rx="2" fill="var(--accent)"/><rect x="3.5" y="4" width="4" height="3" fill="var(--paper)"/><rect x="8.5" y="9" width="4" height="3" fill="var(--paper)"/><path d="M5.5 7v3.5h3" stroke="var(--paper)" fill="none"/></svg>

      <div class="rgroup"><div class="btns">

        <button class="rb" id="b-z1" title="Actual size"><svg viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14" fill="none" stroke="var(--ink-2)" stroke-width="1.4"/><text x="10" y="13.5" text-anchor="middle" font-size="8" fill="var(--ink-2)" font-family="sans-serif">1:1</text></svg>100%</button>
        <button class="rb" id="b-zi" title="Zoom in"><svg viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="var(--ink-2)" stroke-width="1.6"/><path d="M12.5 12.5l5 5M6 8.5h5M8.5 6v5" stroke="var(--ink-2)" stroke-width="1.6"/></svg>Zoom in</button>
        <button class="rb" id="b-fit" title="Fit diagram to window"><svg viewBox="0 0 20 20"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4" fill="none" stroke="var(--ink-2)" stroke-width="1.6"/></svg>Fit</button>

<script>
/* ---------- tiny diagram engine (EA-flavoured UML) ---------- */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let S=[],E=[];
function reg(o,label,type){const id=o.id||('e'+E.length);E.push({id,name:(o.name||label||'').replace(/\n/g,' '),type:o.type||type,doc:o.doc||''});return id}
function put(o,label,type,inner){const id=reg(o,label,type);S.push(`<g class="el" data-el="${id}">${inner}</g>`)}
function tl(x,cy,text,cls='',anchor='middle',lh=13){const ls=String(text).split('\n');const y0=cy-(ls.length-1)*lh/2;
  return ls.map((l,i)=>`<text x="${x}" y="${y0+i*lh}" class="${cls}" text-anchor="${anchor}" dominant-baseline="central">${esc(l)}</text>`).join('')}
function label(text,cy,x,anchor){const ls=String(text).split('\n');return ls.map((l,i)=>{const bold=i===0&&ls.length>1;return ''}).join('')}
// action / rounded box: first line bold when multi-line
function body(x,y,w,h,text){const ls=String(text).split('\n');const lh=13,cy=y+h/2,y0=cy-(ls.length-1)*lh/2;
  return ls.map((l,i)=>`<text x="${x+w/2}" y="${y0+i*lh}" text-anchor="middle" dominant-baseline="central" class="${i===0?'b':'s'}">${esc(l)}</text>`).join('')}
function act(x,y,w,h,text,o={}){put(o,text.split('\n')[0],'Action',`<rect class="${o.cls||'shape'}" x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx??9}"/>`+body(x,y,w,h,text))}
function proc(x,y,w,h,text,o={}){act(x,y,w,h,text,{rx:0,type:'Process',...o})}
function term(x,y,w,h,text,o={}){act(x,y,w,h,text,{rx:h/2,type:'Terminator',...o})}
function dec(cx,cy,w,h,text,o={}){put(o,text,o.type||'Decision',`<path class="shape" d="M${cx},${cy-h/2} L${cx+w/2},${cy} L${cx},${cy+h/2} L${cx-w/2},${cy} Z"/>`+tl(cx,cy,text,'s',undefined,12))}
function init(cx,cy,o={}){put(o,'Initial','Initial Node',`<circle class="ink" cx="${cx}" cy="${cy}" r="8"/>`)}
function fin(cx,cy,o={}){put(o,'Final','Activity Final',`<circle class="hollow" cx="${cx}" cy="${cy}" r="10"/><circle class="ink" cx="${cx}" cy="${cy}" r="6"/>`)}
function ffin(cx,cy,o={}){put(o,'Flow final','Flow Final',`<circle class="hollow" cx="${cx}" cy="${cy}" r="9"/><path class="cn" d="M${cx-6},${cy-6} L${cx+6},${cy+6} M${cx+6},${cy-6} L${cx-6},${cy+6}"/>`)}
function note(x,y,w,h,text,o={}){const f=10;put(o,text.split('\n')[0],'Note',`<path class="note" d="M${x},${y} H${x+w-f} L${x+w},${y+f} V${y+h} H${x} Z M${x+w-f},${y} V${y+f} H${x+w}"/>`+
  String(text).split('\n').map((l,i)=>`<text x="${x+8}" y="${y+15+i*13.5}" class="s">${esc(l)}</text>`).join(''))}
function frame(kind,name,w,h){const t=`${kind} ${name}`;const lw=Math.round(t.length*6.4)+22;

{id:'peas',pkg:'def',kind:'req',name:'PEAS description',w:900,h:540,
 summary:'The planner described as a rational agent: what counts as a good trip, the world it works in, how it acts and what it perceives.',
 doc:`<p>Tang is modelled as a <b>goal-based, utility-based planning agent</b>. Its goal is a feasible round trip from a Thai home airport to one country and back within the traveller's days. Among all feasible trips it picks the ones that score best on the traveller's chosen preference (cheapest, fastest, fewest flights or balanced).</p>
 <p>Every judgement lives in <code>prolog/trip.pl</code>. Python only collects percepts (the form, live fares) and carries out actions (drawing the plan, the map and the booking links).</p>`,
 extra:`<h3>PEAS table</h3><div class="tbl"><table><thead><tr><th>Element</th><th>For Tang</th><th>Where in the code</th></tr></thead><tbody>
 <tr><td>Performance</td><td>Total cost within budget; flying minutes; number of flights; enjoyment (liked activities); penalty for empty days; visa-free stay respected</td><td><code>plan_key/3</code>, <code>score/3</code>, <code>affordable/3</code>, <code>reasons/11</code></td></tr>
 <tr><td>Environment</td><td>Traveller from Bangkok, Chiang Mai or Phuket; 4 destination countries, 14 cities, 54 flights, ground links, 107 attractions, hotels, seasons, Thai holidays, visa rules; optional Aviasales fares</td><td>Section 1 facts, <code>busy/3</code>, <code>thai_holiday/3</code>, <code>live_fare/3</code></td></tr>
 <tr><td>Actuators</td><td>Up to three ranked plans (A/B/C) with ticket, day-by-day plan, cost table and reasons; animated search replay and journey on the map; booking links</td><td><code>ResultsPanel</code>, <code>MapView</code>, <code>ui/booking.py</code></td></tr>
 <tr><td>Sensors</td><td>Trip form (from, to, date, days, people, budget, interests, pace, preference) and extra options; live fares and departure times; cached fares</td><td><code>TangWindow.form</code>, <code>option_terms()</code>, <code>set_live_fares()</code></td></tr>
 </tbody></table></div>
 <h3>Task-environment properties</h3><div class="tbl"><table><thead><tr><th>Property</th><th>Value</th><th>Why</th></tr></thead><tbody>
 <tr><td>Observable</td><td>Fully (as modelled)</td><td>The knowledge base holds every flight, link and price the agent reasons about. Real prices are only partly observed: Aviasales returns fares users found in the last 48 hours.</td></tr>
 <tr><td>Agents</td><td>Single</td><td>No other agent competes for seats or rooms in the model.</td></tr>
 <tr><td>Deterministic</td><td>Deterministic</td><td>Flights run daily at fixed times; a connection either fits the 90 min – 12 h window or it doesn't.</td></tr>
 <tr><td>Episodic</td><td>Sequential within a plan, episodic across queries</td><td>Arrival time fixes the free hours of day 1, a night ride removes a hotel night. Each query starts from <code>reset_search</code>.</td></tr>
 <tr><td>Static</td><td>Static</td><td>Facts do not change while Prolog deliberates; live fares are asserted before the query.</td></tr>
 <tr><td>Discrete</td><td>Discrete</td><td>Cities, flights, days and minutes.</td></tr>
 <tr><td>Known</td><td>Known</td><td>All rules (time zones, prices by season, day sharing) are written out in the knowledge base.</td></tr>
 </tbody></table></div>`,

 doc:`<p>The schema follows the utility-based agent of Russell &amp; Norvig. Percepts enter as Prolog facts: <code>trip_month/1</code>, <code>option/2</code> and the optional <code>live_fare/3</code> and <code>live_departure/2</code>. The agent then predicts outcomes by search: best-first flight search, tours over ground links and <code>build_plan</code>. It scores each predicted trip with <code>score/3</code> and acts by ranking and choosing up to three plans.</p>

 doc:`<p><code>candidate/8</code> is generate-and-test (Clocksin &amp; Mellish ch. 4). Each <code>member/2</code> and each clause of <code>round_tour/4</code> leaves a choice point. When a test fails, Prolog backtracks to the most recent choice and tries the next alternative. <code>findall/3</code> in <code>plan_trip</code> forces this to happen until every combination has been tried.</p>
 <p>Flight searches are memoised in <code>flight_memo/4</code>, so revisiting the same arrival city costs nothing. Tours allow at most 4 cities and may loop back to the arrival city so the traveller can fly home from it.</p>`,

{id:'bestfirst',pkg:'alg',kind:'act',name:'Best-first flight search',w:860,h:740,
 summary:'best_routes/5: the book\'s go3 best-first search over flights, with time-zone-aware connections.',
 doc:`<p>The search keeps a queue of partial routes <code>r(Cost, Here, Clock, Visited, Legs)</code> and always extends the cheapest one first (<code>shortest/3</code>). Every cost only grows as a route gets longer, so the first complete route taken off the queue is the best. The search stops after the best two.</p>
 <p>A next flight is legal only if it doesn't revisit a city, doesn't route back through Thailand on the way out, matches the airline and night-flight options, and leaves at least 90 minutes and at most 12 hours after landing. The times are compared in UTC. <code>compare_search/5</code> shows that this does far fewer steps than the depth-first <code>fly/3</code>, which must find and sort every route.</p>`,

  d.svg=`<svg class="dg" viewBox="0 0 ${d.w} ${d.h}" width="${d.w}" height="${d.h}" role="img" aria-label="${esc(d.name)}"><rect x="0" y="0" width="${d.w}" height="${d.h}" fill="none"/>${frame(k,d.name,d.w,d.h)}${S.join('')}</svg>`});

/* ---------- app shell ---------- */
const $=s=>document.querySelector(s);
const icon=k=>{const c={req:'var(--el-line)',uc:'var(--el-line)',custom:'var(--el3-line)',cmp:'var(--el2-line)',class:'var(--el2-line)',analysis:'var(--el-line)',act:'var(--el-line)',sd:'var(--el2-line)',stm:'var(--el3-line)'}[k];
  return `<svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" fill="var(--paper)" stroke="${c}"/><rect x="3.5" y="4.5" width="4" height="3" fill="${c}"/><rect x="8.5" y="8.5" width="4" height="3" fill="${c}"/><path d="M5.5 7.5v2.5h3" stroke="${c}" fill="none"/></svg>`};
const FOLDER='<svg viewBox="0 0 16 16"><path d="M1.5 4h5l1.5 1.5h6.5v8h-13z" fill="var(--note)" stroke="var(--note-line)"/></svg>';
const DOCI='<svg viewBox="0 0 16 16"><path d="M3 1.5h7l3 3v10H3z" fill="var(--paper)" stroke="var(--ink-2)"/><path d="M5 7h6M5 9.5h6M5 12h4" stroke="var(--accent)"/></svg>';
const MODELI='<svg viewBox="0 0 16 16"><path d="M8 1.5l6 3.2v6.6L8 14.5l-6-3.2V4.7z" fill="var(--accent-soft)" stroke="var(--accent)"/></svg>';

let cur='report',open=['report'],zoom={},sel=null;
function treeHTML(){let h=`<li><div class="row" style="cursor:default">${'<span class="tw">▾</span>'}${MODELI}<span class="lbl"><b>Tang Trip Planner</b></span></div><ul>`;
  h+=`<li><button class="row" data-go="report"><span class="tw"></span>${DOCI}<span class="lbl">Model report</span><span class="kind">doc</span></button></li>`;
  Object.entries(PKG).forEach(([p,t])=>{h+=`<li><div class="row" style="cursor:default"><span class="tw">▾</span>${FOLDER}<span class="lbl">${esc(t)}</span></div><ul>`;
    D.filter(d=>d.pkg===p).forEach(d=>h+=`<li><button class="row" data-go="${d.id}"><span class="tw"></span>${icon(d.kind)}<span class="lbl">${esc(d.name)}</span><span class="kind">${KIND[d.kind][0]}</span></button></li>`);
    h+='</ul></li>'});
  return h+'</ul></li>'}
$('#tree').innerHTML=treeHTML();
$('#tree').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});

const byId=id=>D.find(d=>d.id===id);
function tabsHTML(){return open.map(id=>{const d=byId(id);const name=d?d.name:'Model report';const ic=d?icon(d.kind):DOCI;
  return `<div class="dtab${id===cur?' on':''}" role="tab" aria-selected="${id===cur}" tabindex="0" data-tab="${id}"><span style="width:14px;height:14px;display:inline-flex">${ic}</span>${esc(name)}${id!=='report'?`<button class="x" data-close="${id}" aria-label="Close ${esc(name)}">×</button>`:''}</div>`}).join('')}
$('#dtabs').addEventListener('click',e=>{const x=e.target.closest('[data-close]');if(x){e.stopPropagation();close(x.dataset.close);return}const t=e.target.closest('[data-tab]');if(t)go(t.dataset.tab)});
$('#dtabs').addEventListener('keydown',e=>{if(e.key==='Enter'){const t=e.target.closest('[data-tab]');if(t)go(t.dataset.tab)}});
function close(id){open=open.filter(x=>x!==id);if(cur===id)go(open[open.length-1]||'report');else render()}

function reportHTML(){
  let h=`<div class="report"><article class="page">
  <h1>Tang (ทาง) Trip Planner</h1>
  <p class="sub">Agent model report: PEAS description, architecture and behaviour of a Prolog + Python travel-planning agent.</p>
  <dl class="meta"><dt>Model</dt><dd>TangTripPlanner · Agent Model</dd><dt>Source</dt><dd><code>prolog/trip.pl</code>, <code>backend/</code>, <code>app.py</code>, <code>ui/</code></dd>
  <dt>Reasoner</dt><dd>SWI-Prolog through pyswip; only constructs taught in Clocksin &amp; Mellish, <i>Programming in Prolog</i></dd>
  <dt>Notation</dt><dd>UML 2.5 (use case, class, component, activity, sequence, state machine), flowchart, PEAS</dd><dt>Diagrams</dt><dd>${D.length}</dd><dt>Generated</dt><dd>19 November 2026</dd></dl>
  <h3>Contents</h3><ol class="toc">${D.map(d=>`<li><a href="#${d.id}" data-jump="${d.id}">${esc(d.name)}</a></li>`).join('')}</ol>`;
  let n=0,last='';
  D.forEach(d=>{if(d.pkg!==last){last=d.pkg;h+=`<h2>${esc(PKG[d.pkg])}</h2>`}n++;
    const docs=d.els.filter(e=>e.doc);
    h+=`<section id="r-${d.id}"><h3>${n}. ${esc(d.name)} <span class="tag">${KIND[d.kind][1]}</span></h3>${d.doc}
    <div class="fig" data-open="${d.id}" title="Open in diagram view">${d.svg}</div>
    <div class="cap">Figure ${n}: ${esc(KIND[d.kind][0])} ${esc(d.name)} · <button data-open="${d.id}">open in diagram view</button></div>
    ${d.extra||''}
    ${docs.length?`<div class="tbl"><table><thead><tr><th>Element</th><th>Type</th><th>Notes</th></tr></thead><tbody>${docs.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.type)}</td><td>${esc(e.doc)}</td></tr>`).join('')}</tbody></table></div>`:''}</section>`});
  return h+`<p class="cap" style="margin-top:28px">Prices, timetables and visa rules in the knowledge base are sample data for a class project.</p></article></div>`}

function propsHTML(){
  if(cur==='report')return `<dl class="props"><dt>Name</dt><dd>Model report</dd><dt>Type</dt><dd>Document</dd><dt>Diagrams</dt><dd>${D.length}</dd><dt>Elements</dt><dd>${D.reduce((a,d)=>a+d.els.length,0)}</dd><dt>Status</dt><dd>Approved</dd></dl>
    <div class="phead" style="margin-top:6px">Notes</div><div class="notes"><p>Generated document for the whole model. Click a figure or a contents entry to open that diagram.</p></div>`;
  const d=byId(cur),e=sel&&d.els.find(x=>x.id===sel);
  const top=e?`<dl class="props"><dt>Name</dt><dd>${esc(e.name)}</dd><dt>Type</dt><dd>${esc(e.type)}</dd><dt>Diagram</dt><dd>${esc(d.name)}</dd><dt>Package</dt><dd>${esc(PKG[d.pkg])}</dd></dl>
    <div class="phead" style="margin-top:6px">Notes</div><div class="notes"><p>${e.doc?esc(e.doc):'<span style="color:var(--ink-3)">No notes for this element.</span>'}</p></div>`
   :`<dl class="props"><dt>Name</dt><dd>${esc(d.name)}</dd><dt>Type</dt><dd>${KIND[d.kind][1]}</dd><dt>Package</dt><dd>${esc(PKG[d.pkg])}</dd><dt>Size</dt><dd>${d.w} × ${d.h}</dd><dt>Elements</dt><dd>${d.els.length}</dd><dt>Version</dt><dd>1.0</dd></dl>
    <div class="phead" style="margin-top:6px">Notes</div><div class="notes">${d.doc}</div>`;
  return top+`<div class="phead" style="margin-top:6px">Elements in diagram</div><ul class="ellist">${d.els.filter(x=>!/^(e\d+)$/.test(x.id)||x.type!=='Initial Node').map(x=>`<li><button data-sel="${x.id}" class="${x.id===sel?'on':''}">${esc(x.name||'(unnamed)')} <small>${esc(x.type)}</small></button></li>`).join('')}</ul>`}
$('#props').addEventListener('click',e=>{const b=e.target.closest('[data-sel]');if(b)select(b.dataset.sel===sel?null:b.dataset.sel)});

function render(){
  $('#dtabs').innerHTML=tabsHTML();
  document.querySelectorAll('#tree [data-go]').forEach(b=>b.classList.toggle('on',b.dataset.go===cur));
  const v=$('#view');const d=byId(cur);
  if(!d){v.innerHTML=reportHTML();$('#tt').textContent='Model report';$('#st-l').textContent=`Model report · ${D.length} diagrams`;$('#st-z').textContent='';}
  else{v.innerHTML=`<div class="canvas">${d.svg}</div>`;$('#tt').textContent=d.name;applyZoom();}
  ['#b-zo','#b-z1','#b-zi','#b-fit'].forEach(s=>$(s).disabled=!d);
  const i=D.indexOf(d);$('#b-prev').disabled=i<=0&&!!d;$('#b-next').disabled=i===D.length-1;
  drawSel();$('#props').innerHTML=propsHTML();
}
function go(id,keepScroll){if(id!=='report'&&!byId(id))id='report';if(!open.includes(id))open.push(id);if(cur!==id){cur=id;sel=null}render();if(!keepScroll)$('#view').scrollTop=0;
  try{history.replaceState(null,'','#'+id)}catch(_){} }
function applyZoom(){const d=byId(cur);if(!d)return;const z=zoom[cur]??1;const s=$('#view svg');s.setAttribute('width',Math.round(d.w*z));s.setAttribute('height',Math.round(d.h*z));
  $('#st-z').textContent=`Zoom ${Math.round(z*100)}%`;$('#st-l').textContent=`${KIND[d.kind][0]} ${d.name} · ${d.els.length} elements · ${PKG[d.pkg]}`}
function setZoom(z){zoom[cur]=Math.max(.3,Math.min(2.5,z));applyZoom();drawSel()}
$('#b-zi').onclick=()=>setZoom((zoom[cur]??1)+.15);
$('#b-zo').onclick=()=>setZoom((zoom[cur]??1)-.15);
$('#b-z1').onclick=()=>setZoom(1);
$('#b-fit').onclick=()=>{const d=byId(cur);const v=$('#view');setZoom(Math.min((v.clientWidth-34)/d.w,(v.clientHeight-34)/d.h))};
$('#b-report').onclick=()=>go('report');
$('#b-prev').onclick=()=>{const i=D.indexOf(byId(cur));go(D[Math.max(0,i-1)].id)};
$('#b-next').onclick=()=>{const i=D.indexOf(byId(cur));go(D[Math.min(D.length-1,i+1)].id)};

/* selection with EA-style handles */
function select(id){sel=id;drawSel();$('#props').innerHTML=propsHTML()}
function drawSel(){const svg=$('#view svg.dg');if(!svg||!byId(cur))return;svg.querySelectorAll('.selg').forEach(n=>n.remove());if(!sel)return;
  const g=svg.querySelector(`[data-el="${CSS.escape(sel)}"]`);if(!g)return;const b=g.getBBox(),p=3,x=b.x-p,y=b.y-p,w=b.width+2*p,h=b.height+2*p;
  const pts=[[x,y],[x+w/2,y],[x+w,y],[x,y+h/2],[x+w,y+h/2],[x,y+h],[x+w/2,y+h],[x+w,y+h]];
  const NS='http://www.w3.org/2000/svg';const sg=document.createElementNS(NS,'g');sg.setAttribute('class','selg');
  sg.innerHTML=`<rect class="selbox" x="${x}" y="${y}" width="${w}" height="${h}"/>`+pts.map(([a,c])=>`<rect class="handle" x="${a-3}" y="${c-3}" width="6" height="6"/>`).join('');
  svg.appendChild(sg);
  const st=byId(cur).els.find(e=>e.id===sel);if(st)$('#st-l').textContent=`${st.type}: ${st.name}`}
$('#view').addEventListener('click',e=>{
  const o=e.target.closest('[data-open]');if(o&&cur==='report'){go(o.dataset.open);return}
  const j=e.target.closest('[data-jump]');if(j){e.preventDefault();document.getElementById('r-'+j.dataset.jump)?.scrollIntoView({block:'start'});return}
  if(cur==='report')return;const g=e.target.closest('[data-el]');select(g?g.dataset.el:null)});

const start=(location.hash||'').slice(1);
if(start&&byId(start)){open.push(start);cur=start}
render();
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==cur&&(h==='report'||byId(h)))go(h)});
</script>
